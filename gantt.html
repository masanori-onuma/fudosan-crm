  document.getElementById('modalEl').innerHTML=`
    <div class="modal-overlay"><div class="modal">
    <h3>${isNew?'子項目を追加':'子項目を編集'}</h3>
    <div class="field"><label>項目名</label><input id="c_name" style="touch-action:manipulation" value="${esc(child.name||'')}"></div>
    <div class="field"><label>数量・面積</label><input id="c_area" style="touch-action:manipulation" value="${esc(child.area||'')}"></div>
    <div class="field"><label>材料名・数量</label><input id="c_material" style="touch-action:manipulation" placeholder="例：サンゲツ RE-7512　148m²" value="${esc(child.material||'')}"></div>
    <div class="field"><label>備考</label><input id="c_note" style="touch-action:manipulation" placeholder="品番・メモなど" value="${esc(child.note||'')}"></div>
    ${_trackOrder?`<div class="field" style="display:flex;flex-direction:column;gap:8px">
      <label style="margin:0;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="c_ordered" ${child.ordered?'checked':''} style="width:18px;height:18px;cursor:pointer;touch-action:manipulation">
        <span>発注済み</span>
      </label>
    </div>`:''}
    <div class="field"><label>期間 <span style="font-size:10px;color:#888">（未設定なら親工程と同じ期間）</span></label>
      <div id="childPeriodList">${periodRows}</div>
      <button class="btn btn-sm btn-primary" style="margin-top:4px" onclick="addChildPeriodInModal(${procId},${childId||'null'})">＋ 期間を追加</button>
    </div>
    <div class="modal-btns">
      ${delBtn}
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveChild(${procId},${childId||'null'})">${isNew?'追加':'保存'}</button>
    </div></div></div>`;
}

function addChildPeriodInModal(procId,childId){
  if(childId===null){
    const list=document.getElementById('childPeriodList');
    const div=document.createElement('div');
    div.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:4px';
    div.innerHTML=`<input type="date" style="flex:1;font-size:12px;padding:4px;border:1px solid #ccc;border-radius:4px;touch-action:manipulation" class="new-child-period-start">
      <span style="font-size:11px;color:#888">〜</span>
      <input type="date" style="flex:1;font-size:12px;padding:4px;border:1px solid #ccc;border-radius:4px;touch-action:manipulation" class="new-child-period-end">
      <button class="btn btn-sm btn-danger" onclick="this.parentNode.remove()">×</button>`;
    list.appendChild(div);
    return;
  }
  for(const s of sites)for(const p of s.processes)if(p.id===procId){
    const c=p.children.find(x=>x.id===childId);
    if(c){if(!c.periods)c.periods=[];c.periods.push({startD:'',endD:''});}
    break;
  }
  saveData();
  const site=sites.find(s=>s.processes.some(p=>p.id===procId));
  if(site)openChildModal(site.id,procId,childId);
}

function updateChildPeriod(childId,idx,key,val){
  if(childId===null)return;
  for(const s of sites)for(const p of s.processes){
    const c=p.children.find(x=>x.id===childId);
    if(c&&c.periods&&c.periods[idx]){c.periods[idx][key]=val;saveData();return;}
  }
}

function delChildPeriod(procId,childId,idx){
  if(childId===null)return;
  for(const s of sites)for(const p of s.processes)if(p.id===procId){
    const c=p.children.find(x=>x.id===childId);
    if(c&&c.periods)c.periods.splice(idx,1);
    break;
  }
  saveData();
  const site=sites.find(s=>s.processes.some(p=>p.id===procId));
  if(site)openChildModal(site.id,procId,childId);
}

function saveChild(procId,childId){
  const name=document.getElementById('c_name').value.trim();if(!name)return;
  const area=document.getElementById('c_area').value.trim();
  const note=document.getElementById('c_note').value.trim();
  const material=document.getElementById('c_material').value.trim();
  // 発注済みチェック：発注管理対象の子項目（既存childにorderedフィールドあり）のみ更新
  const orderedCheckbox=document.getElementById('c_ordered');
  for(const s of sites)for(const p of s.processes)if(p.id===procId){
    if(childId===null){
      const newPeriods=[];
      document.querySelectorAll('#childPeriodList > div').forEach(row=>{
        const starts=row.querySelectorAll('.new-child-period-start');
        const ends=row.querySelectorAll('.new-child-period-end');
        if(starts.length&&ends.length&&starts[0].value&&ends[0].value)newPeriods.push({startD:starts[0].value,endD:ends[0].value});
      });
      // 新規追加は子項目モーダル経由では発注管理なし（orderedなし）
      p.children.push({id:nextCid++,name,area,note,material,periods:newPeriods});
    }else{
      const c=p.children.find(x=>x.id===childId);
      if(c){
        Object.assign(c,{name,area,note,material});
        // 発注管理対象のみ ordered を更新
        if(orderedCheckbox&&c.ordered!==undefined){
          c.ordered=orderedCheckbox.checked;
        }
      }
    }
    // 子項目の期間変更 or 追加後、親バーを自動拡張
    _expandProcPeriods(p);
    break;
  }
  saveData();closeModal();
}

function delChild(procId,childId){
  for(const s of sites)for(const p of s.processes)if(p.id===procId){
    p.children=p.children.filter(x=>x.id!==childId);break;
  }
  saveData();closeModal();
}

function closeModal(){document.getElementById('modalEl').innerHTML='';render();}

function saveSite(id){
  const name=document.getElementById('s_name').value.trim();if(!name)return;
  const addr=document.getElementById('s_addr').value.trim();
  const client=document.getElementById('s_client_sel').value==='__custom__'?document.getElementById('s_client_inp').value.trim():document.getElementById('s_client_sel').value;
  const dropboxUrl=document.getElementById('s_dropbox').value.trim();
  const dropboxUrl2=document.getElementById('s_dropbox2').value.trim();
  const keyLocation=document.getElementById('s_key').value.trim();
  const parking=document.getElementById('s_parking').value.trim();
  const koukiStart=document.getElementById('s_kouki_start').value;
  const koukiEnd=document.getElementById('s_kouki_end').value;
  const nyukyoDate=document.getElementById('s_nyukyo_date').value;
  if(id===null)sites.push({id:nextSid++,name,addr,client,dropboxUrl,dropboxUrl2,keyLocation,parking,collapsed:false,koukiStart,koukiEnd,nyukyoDate,processes:[]});
  else{const s=sites.find(x=>x.id===id);if(s)Object.assign(s,{name,addr,client,dropboxUrl,dropboxUrl2,keyLocation,parking,koukiStart,koukiEnd,nyukyoDate});}
  saveData();closeModal();
}
function delSite(id){if(!confirm('削除しますか？'))return;sites=sites.filter(x=>x.id!==id);saveData();closeModal();}

function onSiteChkChange(){

async function executeBulkArchive(ids){
  closeModal();
  showSyncStatus('アーカイブ中…');
  let successCount=0;
  for(const id of ids){
    const r=await gasArchiveSite(id,'manual');
    if(r.ok){
      sites=sites.filter(x=>x.id!==id);
      successCount++;
    }
  }
  // タイムスタンプ付きで保存（読み込み時に新旧判定に使う）
  const _saveTs=Date.now();
  localStorage.setItem('gantt_sites_ts',String(_saveTs));
  _lastSaved=JSON.stringify(sites);
  localStorage.setItem('gantt_sites',_lastSaved);
  _archivedCache=null;
  // チェックボックスとボタンをリセット
  const btn=document.getElementById('bulkArchiveBtn');
  if(btn){btn.classList.remove('visible');btn.disabled=true;btn.textContent='📦 まとめてアーカイブ';}
  const allChk=document.getElementById('chkAllSites');
  if(allChk){allChk.checked=false;allChk.indeterminate=false;}
  showSyncStatus('✓ '+successCount+'件アーカイブしました',3000);
  render();
}
async function archiveSite(id){
  if(_viewMode==='archived'){alert('アーカイブ閲覧中は操作できません');return;}
  const s=sites.find(x=>x.id===id);if(!s)return;
  const procs=s.processes||[];
  const allDone=procs.length>0&&procs.every(p=>p.done);
  let msg='この物件をアーカイブしますか？\n\n';
  msg+='物件: '+s.name+'\n';
  if(!allDone&&procs.length>0){
    const notDone=procs.filter(p=>!p.done).length;
    msg+='\n⚠ 未完了の工程が'+notDone+'個あります。\n本当にアーカイブしますか？';
  }else if(procs.length===0){
    msg+='\n⚠ 工程が未登録です。\n本当にアーカイブしますか？';
  }else{
    msg+='\n全'+procs.length+'工程が完了しています。';
  }
  if(!confirm(msg))return;

  showSyncStatus('アーカイブ中…');
  // GASでアーカイブ実行
  const r=await gasArchiveSite(id,'manual');
  if(!r.ok){
    showSyncStatus('アーカイブ失敗',3000);
    alert('アーカイブに失敗しました: '+r.error);
    return;
  }
  // ローカルのsitesからも削除
  sites=sites.filter(x=>x.id!==id);
  // _lastSavedを更新してGAS側と整合
  // タイムスタンプ付きで保存（読み込み時に新旧判定に使う）
  const _saveTs=Date.now();
  localStorage.setItem('gantt_sites_ts',String(_saveTs));
  _lastSaved=JSON.stringify(sites);
  localStorage.setItem('gantt_sites',_lastSaved);
  // キャッシュは無効化（次回閲覧時に再取得）
  _archivedCache=null;
  showSyncStatus('✓ アーカイブしました',3000);
  closeModal();
}

async function unarchiveSite(id){
  if(!confirm('この物件を現役に戻しますか？'))return;
  showSyncStatus('復元中…');
  const r=await gasUnarchiveSite(id);
  if(!r.ok){
    showSyncStatus('復元失敗',3000);
    alert('復元に失敗しました: '+r.error);
    return;
  }
  // キャッシュから該当物件を除去
  if(_archivedCache)_archivedCache=_archivedCache.filter(x=>x.id!==id);
  // 現役側を再読込
  await loadData();
  showSyncStatus('✓ 現役に戻しました',3000);
  // 閲覧中ならアーカイブ画面を再描画
  if(_viewMode==='archived')renderArchiveView();
  else closeModal();
}

// _archiveMonthsBack: アーカイブ表示期間（月数、初期6ヶ月）

async function openArchiveView(){
  if(_viewMode==='archived')return; // 既にアーカイブモード

  // 初回ロード
  if(_archivedCache===null){
    showSyncStatus('アーカイブ読込中…');
    const data=await gasLoadArchived();
    if(data===null){
      showSyncStatus('読込失敗',3000);
      alert('アーカイブの読み込みに失敗しました');
      return;
    }
    _archivedCache=data;
    showSyncStatus('✓ 読込完了',1500);
  }

  // 現役を退避してアーカイブモードへ
  _activeSitesBackup=sites;
  _viewMode='archived';
  _archiveMonthsBack=6;
  _archiveSearch='';
  applyArchiveFilter();
  updateArchiveBanner();
  render();
  scrollToToday();
}

function exitArchiveView(){
  if(_viewMode!=='archived')return;
  // 現役データに復帰
  sites=_activeSitesBackup||[];
  _activeSitesBackup=null;
  _viewMode='active';
  updateArchiveBanner();
  render();
  scrollToToday();
}

// アーカイブキャッシュから期間＋検索でフィルタしてsitesに入れる
function applyArchiveFilter(){
  if(_viewMode!=='archived'||!_archivedCache){sites=[];return;}
  // 表示期間: 現在から _archiveMonthsBack ヶ月前まで（完成日ベース）
  const now=new Date();
  const from=new Date(now.getFullYear(),now.getMonth()-_archiveMonthsBack,1);
  const fromN=from.getFullYear()*10000+(from.getMonth()+1)*100+from.getDate();
  const q=(_archiveSearch||'').toLowerCase().trim();

  sites=_archivedCache.filter(s=>{
    // 検索があれば期間無視で全件対象
    if(q){
      const hit=(s.name||'').toLowerCase().includes(q)||(s.addr||'').toLowerCase().includes(q);
      if(!hit)return false;
    }else{
      // 期間フィルタ: koukiEnd が範囲内
      if(!s.koukiEnd)return false; // 完成日なしは検索時のみ表示
      const parts=s.koukiEnd.split('-');
      const kN=parseInt(parts[0])*10000+parseInt(parts[1])*100+parseInt(parts[2]);
      if(kN<fromN)return false;
    }
    return true;
  });
  // 完成日昇順（古い順→下にいくほど新しい、通常画面の工期の流れに合わせる）
  sites.sort((a,b)=>(a.koukiEnd||'').localeCompare(b.koukiEnd||''));
}

  let banner=document.getElementById('archiveBanner');
  if(_viewMode!=='archived'){
    if(banner)banner.remove();
    return;
  }
  const total=_archivedCache?_archivedCache.length:0;
  const shown=sites.length;
  const periodLabel=_archiveSearch?'検索結果':('直近'+_archiveMonthsBack+'ヶ月');
  const html=`
    <div id="archiveBanner" style="background:#fff4e0;border-bottom:2px solid #f0c168;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:47px;z-index:99">
      <span style="font-weight:600;color:#a06000">📦 アーカイブ閲覧中</span>
      <span style="font-size:12px;color:#555">${periodLabel}: ${shown}件 / 全${total}件</span>
      <input id="archSearchInp" placeholder="検索（物件名・所在地）" value="${esc(_archiveSearch||'')}" oninput="onArchiveSearchInput(this.value)" style="height:26px;padding:0 8px;font-size:12px;border:1px solid #ccc;border-radius:6px;min-width:180px">
      ${_archiveSearch?'':`<button class="btn btn-sm" onclick="expandArchivePeriod()" title="表示期間を1年延長">＋ もっと古い期間</button>`}
      <button class="btn btn-sm" onclick="reloadArchivedData()" title="再読込">🔄</button>
      <button class="btn btn-sm btn-primary" onclick="exitArchiveView()" style="margin-left:auto">◀ 現役に戻る</button>
    </div>`;
  const tmp=document.createElement('div');
  tmp.innerHTML=html.trim();
  const newBanner=tmp.firstElementChild;
  if(banner){
    banner.replaceWith(newBanner);
  }else{
    const header=document.querySelector('header');
    if(header)header.insertAdjacentElement('afterend',newBanner);
  }
}

function saveProc(siteId,procId){
  const name=(document.getElementById('p_name_sel').value||document.getElementById('p_name_inp').value).trim();if(!name)return;
  const persons=[...document.querySelectorAll('#personList .person-inp')].map(el=>el.value.trim()).filter(Boolean);
  const person=persons[0]||''; // 後方互換のため1件目をpersonにも保存
  const area=document.getElementById('p_area').value.trim();
  const color=document.getElementById('p_color').value;
  const site=sites.find(x=>x.id===siteId);if(!site)return;

  // 新規子項目をchildListから収集
  const newChildren=[];
  document.querySelectorAll('#childList > div').forEach(row=>{
    const nm=row.querySelector('.new-child-name');
    const ar=row.querySelector('.new-child-area');
    const nt=row.querySelector('.new-child-note');
    const trk=row.querySelector('.new-child-track-order');
    if(nm&&nm.value.trim()){
      const child={id:nextCid++,name:nm.value.trim(),area:ar?ar.value.trim():'',note:nt?nt.value.trim():''};
      if(nm.value.trim()==='クロス貼替') child.material='SP2516';
      if(trk&&trk.checked)child.ordered=false; // 発注管理ONなら未発注からスタート
      newChildren.push(child);
    }
  });

  if(procId===null){
    const periods=[];
    document.querySelectorAll('#periodList > div').forEach(row=>{
      const inputs=row.querySelectorAll('input[type=date]');
      if(inputs.length>=2)periods.push({startD:inputs[0].value,endD:inputs[1].value});
    });
    site.processes.push({id:nextPid++,name,person,persons,area,periods,done:false,color,children:newChildren});
  }else{
    const p=site.processes.find(x=>x.id===procId);
    if(p){
      const periods=[];
      document.querySelectorAll('#periodList > div').forEach(row=>{
        const inputs=row.querySelectorAll('input[type=date]');
        if(inputs.length>=2)periods.push({startD:inputs[0].value,endD:inputs[1].value});
      });
      Object.assign(p,{name,person,persons,area,color,periods});
      if(newChildren.length>0)p.children=[...p.children,...newChildren];
    }
  }
  if(!persons.length){
    if(!confirm('担当者が未入力です。このまま保存しますか？'))return;
  }
  saveData(siteId);closeModal();
}
function delProc(siteId,procId){
  const site=sites.find(x=>x.id===siteId);if(!site)return;
  site.processes=site.processes.filter(x=>x.id!==procId);saveData(siteId);closeModal();
}

  renderSumpouMode();
  // 物件指定モードの場合、最初の未入力欄にフォーカス
  if(jumpToSiteId){
    setTimeout(()=>{
      const panel=document.querySelector('.smp-panel');
      const firstEmpty=panel?panel.querySelector('.f-num:placeholder-shown'):null;
      if(firstEmpty)firstEmpty.focus();
    },200);
  }
}

// 工期判定：今日からの日数で色を決める
function _smpKoukiBadge(site){
  if(!site.koukiEnd)return '<span class="smp-badge gray">工期未設定</span>';
  const todayN=toN(new Date());
  const endN=toN(parseD(site.koukiEnd));
  const diff=endN-todayN;
  const fmtMD=(d)=>{const x=parseD(d);return (x.getMonth()+1)+'/'+x.getDate();};
  if(diff<=3)return `<span class="smp-badge red">⚠ ${fmtMD(site.koukiEnd)}</span>`;
  if(diff<=7)return `<span class="smp-badge amber">${fmtMD(site.koukiEnd)}</span>`;
  return `<span class="smp-badge gray">${fmtMD(site.koukiEnd)}</span>`;
}

// 工期で物件をソート（近い順、未設定は最後）
function _smpSortSites(arr){
  return arr.slice().sort((a,b)=>{
    if(!a.koukiEnd&&!b.koukiEnd)return 0;
    if(!a.koukiEnd)return 1;
    if(!b.koukiEnd)return -1;
    return toN(parseD(a.koukiEnd))-toN(parseD(b.koukiEnd));
  });
}

// material文字列を「品番」「数量」に分割（最初のスペースで区切り）
function _splitMaterial(m){
  if(!m)return {num:'',size:'',qty:''};
  // オブジェクト形式（新形式）はそのまま返す
  if(typeof m==='object')return {num:m.num||'',size:m.size||'',qty:m.qty||''};
  // 文字列形式（旧形式）はスペース区切りで分解
  const parts=m.split(/[\s　]+/);
  if(parts.length===1)return {num:parts[0],size:'',qty:''};
  if(parts.length===2)return {num:parts[0],size:'',qty:parts[1]};
  return {num:parts[0],size:parts[1],qty:parts.slice(2).join(' ')};
}

function _joinMaterial(num,size,qty){
  // オブジェクト形式で保存（新形式）
  return {num:(num||'').trim(),size:(size||'').trim(),qty:(qty||'').trim()};
}

// materialが入力済みかどうかの判定
// ============================================================
// クロス合計計算
// ============================================================
// material.size から天井高(cm)を抽出する
// 例: "2.45m" → 245, "245cm" → 245, "2450mm" → 245, "2.45" → 245
// 寸法入力のm/cm切替ボタン用：数値＋unitボタンの状態からcm文字列に変換して返す
// unit='m'→"240cm", unit='cm'→"240cm" として保存（_parseHeightCmで読めるcm形式）
function _unitBtnToCmStr(val, unit) {
  const n = parseFloat(val);
  if(!val || isNaN(n)) return val; // 空または非数値はそのまま
  if(unit === 'm') return Math.round(n * 100) + 'cm';
  return Math.round(n) + 'cm';
}
// cm文字列から表示用の数値と単位を推定（例: "240cm" → {val:"2.4", unit:"m"}）
function _cmStrToDisplay(sizeStr) {
  if(!sizeStr) return {val:'', unit:'m'};
  const cmMatch = sizeStr.match(/^(\d+\.?\d*)\s*cm$/i);
  if(cmMatch) {
    const cm = parseFloat(cmMatch[1]);
    // 200cm以上はcm表示、未満はm表示
    if(cm >= 200) return {val: Math.round(cm)+'', unit:'cm'};
    return {val: (cm/100)+'', unit:'m'};
  }
  const mMatch = sizeStr.match(/^(\d+\.?\d*)\s*m$/i);
  if(mMatch) return {val: mMatch[1], unit:'m'};
  return {val: sizeStr, unit:'m'};
}

function _parseHeightCm(sizeStr) {
  if(!sizeStr) return null;
  const s = String(sizeStr).trim();
  const mMatch = s.match(/^(\d+\.?\d*)\s*m$/i);
  if(mMatch) { const cm2 = Math.round(parseFloat(mMatch[1]) * 100); return cm2 >= 1000 ? null : cm2; } // 10m以上スキップ
  const cmMatch = s.match(/^(\d+\.?\d*)\s*cm$/i);
  if(cmMatch) return Math.round(parseFloat(cmMatch[1]));
  const mmMatch = s.match(/^(\d+\.?\d*)\s*mm$/i);
  if(mmMatch) return Math.round(parseFloat(mmMatch[1]) / 10);
  // 単位なし：2.45以下ならmとみなす、それ以上はcmとみなす
  const numMatch = s.match(/^(\d+\.?\d*)$/);
  if(numMatch) {
    const v = parseFloat(numMatch[1]);
    const cm = v <= 10 ? Math.round(v * 100) : Math.round(v);
    return cm >= 1000 ? null : cm; // 10m以上はロール長とみなしてスキップ
  }
  return null;
}

// クロス合計計算：同一品番の複数サイズ・数量からリピートを考慮した合計を計算
// entries: [{size, qty}] (sizeは天井高cm, qtyは本数)
// repeatCm: リピート長(cm)、0または未指定ならリピートなし
// lossCm: ロス(cm)、デフォルト100cm(1m)
function _calcCrossTotal(entries, repeatCm, lossCm) {
  lossCm = lossCm !== undefined ? lossCm : 100;
  let totalCm = 0;
  const details = [];
  entries.forEach(({heightCm, qty}) => {
    if(!heightCm || !qty) return;
    let useCm;
    if(repeatCm && repeatCm > 0) {
      // リピートあり：天井高をリピートで切り上げ
      useCm = Math.ceil(heightCm / repeatCm) * repeatCm;
    } else {
      useCm = heightCm;
    }
    const subtotal = useCm * qty;
    totalCm += subtotal;
    details.push({heightCm, qty, useCm, subtotal});
  });
  const grandTotal = totalCm + lossCm;
  return {totalCm, grandTotal, details, lossCm};
}

// 発注一覧で同一品番グループの計算結果HTMLを生成
// 工程内の全childをまとめて品番グループ化し、青ボックスを一括生成
function _renderProcCalcBoxes(siteId, procId, procName, visibleChildIds) {
  const site = sites.find(s => s.id === siteId);
  if(!site) return '';
  const proc = site.processes.find(p => p.id === procId);
  if(!proc) return '';

  // 品番グループMap: normNum → {num, isCF, isCross, isExtra, items[], childCtxs[]}
  const groups = new Map();
  const _parseHeightCmLocal = (s) => {
    const v = _parseHeightCm(s);
    return (v !== null && v !== undefined) ? v : 0;
  };
  const _addToGroup = (numRaw, sizeStr, qtyStr, isExtra, childCtx) => {
    if(!numRaw) return;
    const normNum = numRaw.trim().toUpperCase();
    const isCF = /^CF/.test(normNum);
    const isCross = !isCF && !isExtra && (/クロス/.test(procName||'')||/クロス/.test(childCtx.childName||''));
    if(!/^[A-Z0-9]/.test(normNum)) return;
    const size = (sizeStr||'').trim();
    const qty = (qtyStr||'').trim();
    const heightCm = _parseHeightCmLocal(size);
    if(!groups.has(normNum)) {
      groups.set(normNum, {num: numRaw.trim(), isCF, isCross, isExtra, items:[], childCtxs:[]});
    }
    const g = groups.get(normNum);
    if(size || qty) g.items.push({size, qty, heightCm});
    // 同じchildCtxが未登録なら追加
    if(childCtx && !g.childCtxs.find(x=>x.child.id===childCtx.child.id&&x.isExtra===childCtx.isExtra&&(!childCtx.isExtra||x.exId===childCtx.exId))) {
      g.childCtxs.push(childCtx);
    }
  };

  const children = (proc.children||[]).filter(c => visibleChildIds.includes(c.id));
  children.forEach(child => {
    const p = _splitMaterial(child.material||'');
    _addToGroup(p.num, p.size, p.qty, false, {child, childName: child.name, isExtra: false});
    (child.extraMaterials||[]).forEach(ex => {
      if(ex.sizeOnly) {
        const normBase = p.num.trim().toUpperCase();
        if(groups.has(normBase)) {
          const ep = _splitMaterial(ex.material||'');
          if(ep.size||ep.qty) groups.get(normBase).items.push({size:ep.size||'',qty:ep.qty||'',heightCm:_parseHeightCmLocal(ep.size)});
        }
      } else {
        const ep = _splitMaterial(ex.material||'');
        _addToGroup(ep.num, ep.size, ep.qty, true, {child, childName: child.name, isExtra: true, exId: ex.id, ex});
      }
    });
  });

  if(groups.size === 0) return '';

  let html = '';
  groups.forEach((group, normNum) => {
    if(!group.childCtxs.length) return; // childCtxsがなければスキップ
    const escapedNum = normNum.replace(/'/g,"\\'");

    // 発注チェック・在庫HTML生成
    // 各childCtxの発注ボックスフッターを生成（新デザイン）
    const _makeOrderBox = (ctx, itemsHtml, calcHtml) => {
      const {child, isExtra, exId, ex} = ctx;
      const isOrdered = isExtra ? (ex&&ex.ordered===true) : (child.ordered===true);
      const checkOnchange = isExtra
        ? `ordToggleExtraOrdered(${siteId},${procId},${child.id},${exId},this.checked)`
        : `ordToggleOrdered(${siteId},${procId},${child.id},this.checked)`;

      // 数量チェック
      const _mat = isExtra ? _splitMaterial(ex&&ex.material||'') : _splitMaterial(child.material||'');
      const hasQty = !!(group.items.length > 0 || _mat.qty);
      const qtyWarnHtml = !hasQty && !isOrdered
        ? `<div class="ord-box-warn">⚠ 数量未入力 — 編集ボタンで入力してください</div>` : '';

      // 在庫
      const codeNorm = normNum.toLowerCase().replace(/[\s　\-]+/g,'');
      let stockHtml='', hasStock=false;
      if(codeNorm && !isOrdered) {
        const {direct,alias,aliasLabel}=_stockMatchWithAlias(codeNorm);
        const matched=[...direct,...alias];
        if(matched.length) {
          hasStock=true;
          const aliasNote=alias.length&&aliasLabel?`<span style="font-size:10px;color:#5a8ab0;margin-left:4px">（※${aliasLabel}）</span>`:'';
          const stockDesc=matched.map(st=>`${esc(st.code||'')}${st.qty?' '+esc(st.qty):''}${st.count>1?' × '+st.count+'本':''}`).join('、');
          const skipFn = isExtra ? `ordShowSkipInput('ex',${child.id},${exId},this)` : `ordShowSkipInput('ch',${child.id},0,this)`;
          stockHtml=`<div class="ord-box-stock">
            <div class="ord-box-stock-row">
              <div class="ord-box-stock-info">📦 ${stockDesc}${aliasNote}</div>
              <button class="ord-stock-use" onclick="ordUseStock(${matched[0].id},'${isExtra?'ex':'ch'}',${child.id},${isExtra?exId:0},this)" style="font-size:11px;padding:3px 8px">在庫を使う</button>
            </div>
            <button style="font-size:11px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;display:block;text-align:right;width:100%" onclick="${skipFn}">在庫を使わない場合はこちら →</button>
          </div>`;
        }
      }

      const skipReason = isExtra ? (ex&&ex.skipReason) : child.skipReason;
      const usedStock = isExtra ? (ex&&ex.usedStockId) : child.usedStockId;
      const checkDisabled = (!hasQty && !isOrdered) || (hasStock && !skipReason && !usedStock && !isOrdered) ? 'disabled' : '';
      const checkColor = checkDisabled ? '#bbb' : (isOrdered ? '#1565c0' : '#1565c0');

      const checkHtml = `<div class="ord-box-check">
        <label style="color:${checkColor};cursor:${checkDisabled?'not-allowed':'pointer'};display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap">
          <input type="checkbox" ${isOrdered?'checked':''} ${checkDisabled} onchange="${checkOnchange}" style="accent-color:#1976d2;width:16px;height:16px">
          <span>${isOrdered?'✓ 発注済み':'発注する'}</span>
        </label>
      </div>`;

      return `<div class="ord-box-header">
        <div class="ord-box-left">
          <div class="ord-box-code">${esc(group.num)}</div>
          ${calcHtml ? `<div class="ord-box-qty">${calcHtml}</div>` : ''}
          ${itemsHtml ? `<div class="ord-box-detail">${itemsHtml}</div>` : ''}
          ${qtyWarnHtml}
        </div>
        ${checkHtml}
      </div>
      ${stockHtml}`;
    };
    // 各childCtxのボックスを生成（品番単位で1つにまとめる：最初のctxのみ使用）
    const _primaryCtx = group.childCtxs[0];
    const _boxFooters = _primaryCtx ? (() => {
      const ctx = _primaryCtx;
      return _makeOrderBox(ctx, null, null); // itemsHtml/calcHtmlは各ボックス側で渡す
    })() : '';

    if(group.isCF) {
      const itemsHtml = group.items.map(it=>`${it.size||'?'}${(it.qty&&parseInt(it.qty)>1)?' × '+it.qty+'本':''}`).join('　');
      html+=`<div class="calc-result-box">
        ${_makeOrderBox(_primaryCtx, itemsHtml, null)}
      </div>`;
    } else if(group.isCross) {
      const repeatKey = 'repeat_'+siteId+'_'+procId+'_'+(children[0]&&children[0].id||0)+'_'+normNum;
      const repeatCm = parseInt(localStorage.getItem(repeatKey))||0;
      const entries = group.items.filter(it=>it.heightCm&&parseInt(it.qty));
      if(entries.length===0) {
        const itemsHtml = group.items.map(it=>`${it.size||'?'}${(it.qty&&parseInt(it.qty)>1)?' × '+it.qty+'本':''}`).join('　');
        html+=`<div class="calc-result-box">
          ${_makeOrderBox(_primaryCtx, itemsHtml, null)}
          <div class="ord-box-repeat">
            <label>リピート</label>
            <input type="number" value="${repeatCm||''}" placeholder="なし" min="0" maxlength="3"
              onchange="setCalcRepeat(${siteId},${procId},${children[0]&&children[0].id||0},'${escapedNum}',this.value);renderOrderListMode()">
            <span>cm（0=なし）</span>
          </div>
        </div>`;
      } else {
        const calcEntries = entries.map(it=>({heightCm:it.heightCm,qty:parseInt(it.qty)}));
        const result = _calcCrossTotal(calcEntries, repeatCm, 100);
        const totalM = Math.ceil(result.grandTotal/100);
        const detailHtml = result.details.map(d=>{
          const useCmStr = repeatCm&&repeatCm>0?`⌈${d.heightCm}÷${repeatCm}⌉×${repeatCm}=${d.useCm}cm`:`${d.heightCm}cm`;
          return `${useCmStr} × ${d.qty}本`;
        }).join('、');
        const baseChildId = children[0]&&children[0].id||0;
        const calcQtyHtml = `${totalM}m <span style="font-size:11px;font-weight:400;color:#5a8ab0">（+1mロス・切り上げ）</span>`;
        html+=`<div class="calc-result-box">
          ${_makeOrderBox(_primaryCtx, detailHtml, calcQtyHtml)}
          <div class="ord-box-repeat">
            <label>リピート</label>
            <input type="number" value="${repeatCm||''}" placeholder="なし" min="0" maxlength="3"
              onchange="setCalcRepeat(${siteId},${procId},${baseChildId},'${escapedNum}',this.value);renderOrderListMode()">
            <span>cm（0=なし）</span>
          </div>
        </div>`;
      }
    } else {
      const itemsHtml = group.items.map(it=>`${it.size||''}${(it.qty&&parseInt(it.qty)>1)?' × '+it.qty+'本':''}`).filter(Boolean).join('　');
      html+=`<div class="calc-result-box">
        ${_makeOrderBox(_primaryCtx, itemsHtml, null)}
      </div>`;
    }
  });
  return html;
}

function _renderCalcResult(siteId, procId, baseChildId, procName, childName, orderCtx) {
  // orderCtx: {child, extraMaterials} — 発注チェック・在庫表示用（省略時は表示なし）
  const site = sites.find(s => s.id === siteId);
  if(!site) return '';
  const proc = site.processes.find(p => p.id === procId);
  if(!proc) return '';
  const baseChild = (proc.children||[]).find(c => c.id === baseChildId);
  if(!baseChild) return '';

  const baseParts = _splitMaterial(baseChild.material);
  if(!baseParts.num) return ''; // 品番なしは表示なし

  // 品番ごとにエントリをグループ化
  // Map<品番(正規化), {num:表示用, isCF:bool, items:[{size,qty,heightCm}]}>
  const groups = new Map();

  const _addToGroup = (numRaw, sizeStr, qtyStr, sizeOnly, isExtra=false) => {
    if(!numRaw) return;
    const normNum = numRaw.trim().toUpperCase();
    // CF：表示あり・計算なし
    const isCF = /^CF/.test(normNum);
    // クロス工程かどうかは工程名で判断（追加品番はクロス計算しない）
    const isCross = !isCF && !isExtra && (/クロス/.test(procName||'')||/クロス/.test(childName||''));
    // 日本語等のメモ書きはスキップ（英数字始まりのみボックス表示）
    if(!/^[A-Z0-9]/.test(normNum)) return;
    const size = (sizeStr||'').trim();
    const qty = (qtyStr||'').trim();
    const heightCm = _parseHeightCm(size);
    if(!groups.has(normNum)) {
      groups.set(normNum, {num: numRaw.trim(), isCF, isCross, items: []});
    }
    if(size || qty) {
      groups.get(normNum).items.push({size, qty, heightCm});
    }
  };

  // メイン行
  _addToGroup(baseParts.num, baseParts.size, baseParts.qty, false);

  // extraMaterials
  (baseChild.extraMaterials||[]).forEach(ex => {
    const ep = _splitMaterial(ex.material);
    if(ex.sizeOnly) {
      // サイズ追加：親品番グループに追加
      const normBase = baseParts.num.trim().toUpperCase();
      if(groups.has(normBase) && (ep.size || ep.qty)) {
        groups.get(normBase).items.push({
          size: ep.size, qty: ep.qty, heightCm: _parseHeightCm(ep.size)
        });
      }
    } else {
      // 品番追加：別グループ（クロス計算なし）
      _addToGroup(ep.num, ep.size, ep.qty, false, true);
    }
  });

  if(groups.size === 0) return '';

  // 品番→発注チェック・在庫HTMLを生成するヘルパー
  const _boxFooter = (normNum) => {
    if(!orderCtx) return '';
    const {child, extraMaterials} = orderCtx;
    const childNum = _splitMaterial(child.material||'').num.trim().toUpperCase();
    let isOrdered, checkOnchange, stockMatchCode, skipChildId, isExtra=false, exId;
    if(childNum === normNum) {
      isOrdered = child.ordered===true;
      checkOnchange = `ordToggleOrdered(${siteId},${procId},${child.id},this.checked)`;
      stockMatchCode = childNum;
      skipChildId = child.id;
    } else {
      const ex = (extraMaterials||[]).find(e=>!e.sizeOnly && _splitMaterial(e.material||'').num.trim().toUpperCase()===normNum);
      if(!ex) return '';
      isExtra = true; exId = ex.id;
      isOrdered = ex.ordered===true;
      checkOnchange = `ordToggleExtraOrdered(${siteId},${procId},${child.id},${ex.id},this.checked)`;
      stockMatchCode = normNum;
    }
    // 発注済みの場合はチェック済み状態で表示（外せるように）
    if(isOrdered) {
      return `<div style="margin-top:7px;border-top:1px solid #bbdefb;padding-top:7px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#1565c0;cursor:pointer">
          <input type="checkbox" checked onchange="${checkOnchange}" style="accent-color:#1976d2">
          <span style="font-weight:500">✓ 発注済み</span>
        </label>
      </div>`;
    }
    // 在庫マッチ
    const codeNorm = stockMatchCode.toLowerCase().replace(/[\s　\-]+/g,'');
    let stockHtml='', hasStock=false;
    if(codeNorm) {
      const {direct,alias,aliasLabel}=_stockMatchWithAlias(codeNorm);
      const matched=[...direct,...alias];
      if(matched.length) {
        hasStock=true;
        const aliasNote=alias.length&&aliasLabel?`<span style="font-size:10px;color:#5a8ab0;margin-left:4px">（※${aliasLabel}）</span>`:'';
        const stockDesc=matched.map(st=>`${esc(st.code||'')}${st.qty?' '+esc(st.qty):''}${st.count>1?' × '+st.count+'本':''}`).join('、');
        const skipFn = isExtra ? `ordShowSkipInput('ex',${child.id},${exId},this)` : `ordShowSkipInput('ch',${child.id},0,this)`;
        stockHtml=`<div style="border-top:1px solid #bbdefb;margin-top:7px;padding-top:7px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:11px;color:#888">📦 ${stockDesc}${aliasNote}</div>
            <button class="ord-stock-use" onclick="ordUseStock(${matched[0].id},'${isExtra?'ex':'ch'}',${child.id},${isExtra?exId:0},this)" style="font-size:11px;padding:3px 8px">在庫を使う</button>
          </div>
          <button style="font-size:11px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;display:block;text-align:right;width:100%" onclick="${skipFn}">在庫を使わない場合はこちら →</button>
        </div>`;
      }
    }
    // 発注チェック（在庫あり＋スキップ理由なしはdisabled）
    const skipReason = isExtra ? ((extraMaterials||[]).find(e=>e.id===exId)||{}).skipReason : child.skipReason;
    const usedStock2 = isExtra ? ((extraMaterials||[]).find(e=>e.id===exId)||{}).usedStockId : child.usedStockId;
    const disabled = hasStock && !skipReason && !usedStock2 ? 'disabled' : '';
    const checkHtml=`<div style="margin-top:7px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:${disabled?'#bbb':'#1565c0'};cursor:${disabled?'not-allowed':'pointer'}">
        <input type="checkbox" ${disabled} onchange="${checkOnchange}" style="accent-color:#1976d2">
        <span>発注済みにする</span>
      </label>
    </div>`;
    return stockHtml + checkHtml;
  };

  let html = '';
  groups.forEach((group, normNum) => {
    if(group.items.length === 0) return;
    const escapedNum = normNum.replace(/'/g,"\\'");

    if(group.isCF) {
      // CFはサイズ一覧のみ（計算なし）
      const itemsHtml = group.items.map(it =>
        `${it.size||'?'}${it.qty?' × '+it.qty+'本':''}`
      ).join('　');
      html += `<div class="calc-result-box">
        <div class="cr-title">${esc(group.num)}</div>
        <div class="cr-detail" style="font-size:12px;color:#0C447C;font-weight:500">${itemsHtml}</div>
        ${_boxFooter(normNum)}
      </div>`;
    } else if(group.isCross) {
      const repeatKey = 'repeat_' + siteId + '_' + procId + '_' + baseChildId + '_' + normNum;
      const repeatCm = parseInt(localStorage.getItem(repeatKey)) || 0;
      const entries = group.items.filter(it => it.heightCm && parseInt(it.qty));
      if(entries.length === 0) {
        // サイズが高さとして解釈できない場合はCF同様に一覧表示
        const itemsHtml = group.items.map(it =>
          `${it.size||'?'}${it.qty?' × '+it.qty+'本':''}`
        ).join('　');
        html += `<div class="calc-result-box">
          <div class="cr-title">${esc(group.num)}</div>
          <div class="cr-detail" style="font-size:12px;color:#0C447C;font-weight:500">${itemsHtml}</div>
          ${_boxFooter(normNum)}
        </div>`;
        return;
      }
      const calcEntries = entries.map(it => ({heightCm: it.heightCm, qty: parseInt(it.qty)}));
      const result = _calcCrossTotal(calcEntries, repeatCm, 100);
      const totalM = Math.ceil(result.grandTotal / 100);
      const detailHtml = result.details.map(d => {
        const useCmStr = repeatCm && repeatCm > 0
          ? `⌈${d.heightCm}÷${repeatCm}⌉×${repeatCm}=${d.useCm}cm`
          : `${d.heightCm}cm`;
        return `${useCmStr} × ${d.qty}本`;
      }).join('、');
      html += `<div class="calc-result-box">
        <div class="cr-title">📐 ${esc(group.num)}</div>
        <div class="cr-total">${totalM}m <span style="font-size:11px;font-weight:400;color:#5a8ab0">（+1mロス・切り上げ）</span></div>
        <div class="cr-detail">${detailHtml}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
          <label style="font-size:10px;color:#888">リピート</label>
          <input type="number" value="${repeatCm||''}" placeholder="なし(cm)" min="0"
            style="width:70px;height:24px;font-size:11px;border:1px solid #ccc;border-radius:4px;padding:0 5px;text-align:center"
            onchange="setCalcRepeat(${siteId},${procId},${baseChildId},'${escapedNum}',this.value);renderOrderListMode()">
          <span style="font-size:10px;color:#aaa">cm (0=なし)</span>
        </div>
        ${_boxFooter(normNum)}
      </div>`;
    } else {
      // その他工程：品番＋サイズ一覧のみ表示（計算なし）
      const itemsHtml = group.items.map(it =>
        `${it.size||''}${it.qty?' × '+it.qty+'本':''}`
      ).filter(Boolean).join('　');
      html += `<div class="calc-result-box">
        <div class="cr-title">${esc(group.num)}</div>
        ${itemsHtml?`<div class="cr-detail" style="font-size:12px;color:#0C447C;font-weight:500">${itemsHtml}</div>`:''}
        ${_boxFooter(normNum)}
      </div>`;
    }
  });
  return html;
}

function setCalcRepeat(siteId, procId, childId, normNum, value) {
  const key = 'repeat_' + siteId + '_' + procId + '_' + childId + '_' + normNum;
  const v = parseInt(value) || 0;
  if(v > 0) localStorage.setItem(key, v);
  else localStorage.removeItem(key);
}

function _hasMaterial(m){
  if(!m)return false;
  if(typeof m==='object')return !!(m.num||m.size||m.qty);
  return !!m.trim();
}

// material表示用文字列（品番 サイズ 数量）
function _materialStr(m){
  if(!m)return '';
  if(typeof m==='object')return [m.num,m.size,m.qty].filter(Boolean).join(' ');
  return m;
}

function onSumpouSearch(v){
  _sumpouFilter.search=v;
  // 入力中はDOM全体を再描画せずタイマーで遅延（フォーカスを失わないように）

  window._smpSearchT=setTimeout(()=>{
    renderSumpouMode();
    const inp=document.getElementById('smpSearch');
    if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}

// オーバーレイの外側（パネル以外）クリックで閉じる

    closeSumpouMode();

// フォーカスモード解除：全物件表示に戻す
function smpShowAllSites(){
  _sumpouFilter.focusSiteId=null;
  _sumpouFilter.mode='incomplete';
  renderSumpouMode();
  window.scrollTo({top:0,behavior:'smooth'});
}

function smpUpdateExtraMaterial(siteId,procId,childId,extraId){
  const s=sites.find(x=>x.id===siteId);if(!s)return;
  const p=s.processes.find(x=>x.id===procId);if(!p)return;
  const c=(p.children||[]).find(x=>x.id===childId);if(!c)return;
  const ex=(c.extraMaterials||[]).find(x=>x.id===extraId);if(!ex)return;
  const row=document.getElementById('extra_'+extraId);if(!row)return;
  const num=ex.sizeOnly?(_splitMaterial(c.material).num):(row.querySelector('.f-num')||{value:''}).value.trim();
  const sizeInpEx=row.querySelector('.f-size');
  const sizeRawEx=(sizeInpEx||{value:''}).value.trim();
  const sizeUnitEx=(sizeInpEx&&sizeInpEx.dataset&&sizeInpEx.dataset.unit)||'';
  const size=sizeUnitEx?_unitBtnToCmStr(sizeRawEx,sizeUnitEx):sizeRawEx;
  const qty=(row.querySelector('.f-qty')||{value:''}).value.trim();
  row.querySelectorAll('.f-num,.f-size,.f-qty').forEach(el=>el.classList&&el.classList.remove('dirty'));
  const newMat=_joinMaterial(num,size,qty);

  btns.forEach(b => b.classList.toggle('utbtn-active', b === btn));

function smpUpdateMaterial(siteId,procId,childId){
  const s=sites.find(x=>x.id===siteId);if(!s)return;
  const p=s.processes.find(x=>x.id===procId);if(!p)return;
  const c=(p.children||[]).find(x=>x.id===childId);if(!c)return;
  const row=document.getElementById('smpchild_'+childId);if(!row)return;
  const num=(row.querySelector('.f-num')||{value:''}).value.trim();
  const sizeInp=row.querySelector('.f-size');
  const sizeRaw=(sizeInp||{value:''}).value.trim();
  const sizeUnit=(sizeInp&&sizeInp.dataset&&sizeInp.dataset.unit)||'';
  const size=sizeUnit?_unitBtnToCmStr(sizeRaw,sizeUnit):sizeRaw;
  const qty=(row.querySelector('.f-qty')||{value:''}).value.trim();
  row.querySelectorAll('.f-num,.f-size,.f-qty').forEach(el=>el.classList.remove('dirty'));
  const newMat=_joinMaterial(num,size,qty);
  if(JSON.stringify(c.material)===JSON.stringify(newMat)){_smpUpdatePendingState();return;}
  c.material=newMat;
  // 使用者・日付を自動記録（寸法入力時の足跡）
  const _u=getCurrentUser();
  if(_u)c.materialBy=_u;
  const _d=new Date();
  c.materialAt=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
  saveData(siteId);
  // 入力済みタグの更新（行クラスとタグ表示）だけ再描画
  if(row){
    if(_hasMaterial(newMat)){
      row.classList.add('done-input');
      const nameRow=row.querySelector('.name-row');
      if(nameRow&&!nameRow.querySelector('.smp-tag-done')){
        const tag=document.createElement('span');
        tag.className='smp-tag-done';
        tag.textContent='✓入力済';
        nameRow.querySelector('.name').after(tag);
      }
    }else{
      row.classList.remove('done-input');
      const tag=row.querySelector('.smp-tag-done');
      if(tag)tag.remove();
    }
  }
  smpToast('✓ 保存しました');
  _smpUpdatePendingState();
}

// 在庫カードのスワイプ（左スワイプで編集・削除ボタン表示）
function _initSwipeStock(container){
  (container||document).querySelectorAll('.stock-item-wrap').forEach(wrap=>{
    if(wrap.dataset.swipeInit)return;
    wrap.dataset.swipeInit='1';
    const card=wrap.querySelector('.stock-item');
    if(!card)return;
    let startX=0,startY=0,dragging=false;
    const OPEN=-144;
    wrap.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      dragging=true;
    },{passive:true});
    wrap.addEventListener('touchmove',e=>{
      if(!dragging)return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx))return;
      if(dx<-40){card.style.transform=`translateX(${OPEN}px)`;}
      else if(dx>10){card.style.transform='';}
    },{passive:true});
    wrap.addEventListener('touchend',()=>{dragging=false;});
    document.addEventListener('touchstart',e=>{
      if(!wrap.contains(e.target))card.style.transform='';
    },{passive:true});
  });
}

function _initSwipeDelete(container){
  (container||document).querySelectorAll('.smp-child').forEach(row=>{
    if(row.dataset.swipeInit)return;
    row.dataset.swipeInit='1';
    let startX=0,startY=0,dragging=false;
    row.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      dragging=true;
    },{passive:true});
    row.addEventListener('touchmove',e=>{
      if(!dragging)return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx))return; // 縦スクロール優先
      if(dx<-40){row.classList.add('swipe-open');}
      else if(dx>10){row.classList.remove('swipe-open');}
    },{passive:true});
    row.addEventListener('touchend',()=>{dragging=false;});
    // 行外タップで閉じる
    document.addEventListener('touchstart',e=>{
      if(!row.contains(e.target))row.classList.remove('swipe-open');
    },{passive:true});
  });
}


// col-info列幅リサイズ
function _initColResize(){
  const handle=document.getElementById('colInfoResize');
  if(!handle)return;
  // 既に同じDOM要素に登録済みならスキップ
  if(handle._resizeInited)return;
  handle._resizeInited=true;
  let startX=0,startW=0;

  function applyWidth(w){
    w=Math.max(120,Math.min(600,w));
    document.querySelectorAll('.col-info').forEach(el=>{
      el.style.width=w+'px';
      el.style.minWidth=w+'px';
      el.style.maxWidth=w+'px';
    });
    // スマホ用タッチ判定の_COL_Wも更新
    window._colInfoW=w;
    localStorage.setItem('colInfoW',w);
  }

  handle.addEventListener('mousedown',e=>{
    if(barDrag.active)return; // ガントバードラッグ中は無効
    e.preventDefault();
    e.stopPropagation();
    startX=e.clientX;
    startW=handle.closest('.col-info').offsetWidth;
    handle.classList.add('dragging');
    const onMove=e=>{applyWidth(startW+(e.clientX-startX));};
    const onUp=()=>{
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  // 保存済み幅を復元（なければ初期値150pxでmax-widthを設定）
  const saved=localStorage.getItem('colInfoW');
  applyWidth(saved?parseInt(saved):150);
}

let _smpAddLock=false; // 多重クリック防止
function smpAddSibling(siteId,procId,baseChildId,mode){
  if(_smpAddLock)return; // 多重クリック防止
  _smpAddLock=true;
  setTimeout(()=>_smpAddLock=false,600);
  const s=sites.find(x=>x.id===siteId);if(!s)return;
  const p=s.processes.find(x=>x.id===procId);if(!p)return;
  const baseChild=(p.children||[]).find(x=>x.id===baseChildId);if(!baseChild)return;
  if(!baseChild.extraMaterials)baseChild.extraMaterials=[];
  const isSizeOnly=(mode==='size');
  // サイズ追加の場合は親の品番を引き継いでmaterialに設定
  const inheritNum=isSizeOnly?(_splitMaterial(baseChild.material).num):'';
  const newExtra={id:nextCid++,material:inheritNum,ordered:false,sizeOnly:isSizeOnly};
  baseChild.extraMaterials.push(newExtra);
  saveData();
  if(mode==='order'){renderOrderListMode();}else{
    // 追加直後はフィルタで物件ごと消えないよう全表示モードにする
    _sumpouFilter.mode='all';
    renderSumpouMode();
  }
  setTimeout(()=>{
    const row=document.getElementById('extra_'+newExtra.id);
    if(row){
      row.scrollIntoView({behavior:'smooth',block:'center'});
      const inp=row.querySelector('.f-size')||row.querySelector('.f-num');
      if(inp)inp.focus();
    }
  },50);
}

function renderOrderListMode(){
  const v=document.getElementById('sumpouView');
  const tab=_orderFilter.tab||'list';
  const focusId=_orderFilter.focusSiteId;

  // === タブヘッダー（共通） ===
  const focusSite=focusId?sites.find(s=>s.id===focusId):null;
  const tabHead=`<div class="smp-overlay" onclick="ordOverlayClick(event)"><div class="smp-panel" onclick="event.stopPropagation()">
    <div class="smp-toolbar">
      <button class="btn btn-sm smp-back-btn" onclick="closeOrderListMode()">✕ 閉じる</button>
      <div style="font-size:13px;font-weight:500;margin-left:4px">📋 発注管理</div>
      ${focusId?`<div style="font-size:11px;color:#185FA5;background:#e6f1fb;padding:3px 8px;border-radius:10px;margin-left:4px">📌 ${esc(focusSite?focusSite.name:'')} のみ</div>
        <button class="btn btn-sm smp-back-btn" onclick="ordShowAllSites()" style="font-size:10px">全物件</button>`:''}
    </div>
    <div class="ord-tabs">
      <button class="ord-tab${tab==='list'?' active':''}" onclick="ordSwitchTab('list')">発注一覧</button>
      <button class="ord-tab${tab==='stock'?' active':''}" onclick="ordSwitchTab('stock')">📦 在庫 (${stocks.length})</button>
      <button class="ord-tab${tab==='log'?' active':''}" onclick="ordSwitchTab('log')">📋 使用履歴</button>
    </div>`;

  // === stockタブの場合 ===
  if(tab==='stock'){
    v.innerHTML=tabHead+_renderStockTabBody()+`</div></div><div id="smpSaving" class="smp-saving">✓ 保存しました</div>`;
    return;
  }

  // === logタブの場合 ===
  if(tab==='log'){
    v.innerHTML=tabHead+`<div id="stockLogBody" style="padding:8px 12px"><div style="color:#aaa;font-size:12px;padding:20px 0;text-align:center">読み込み中...</div></div></div></div><div id="smpSaving" class="smp-saving">✓ 保存しました</div>`;
    _loadAndRenderStockLog();
    return;
  }

  // === listタブ：従来の発注一覧（以下、元のコードと同じ） ===
  const search=_orderFilter.search.trim().toLowerCase();
  const mode=_orderFilter.mode;

  // 発注管理対象の子項目があり、アーカイブされていない物件のみ
  let targetSites=sites.filter(s=>{
    if(s.archived)return false;
    if(!s.processes.some(p=>(p.children||[]).some(c=>c.ordered!==undefined)))return false;
    // バナーフィルターが有効なら絞り込む
    if(_assigneeBannerActive&&!_isAssigneeBannerFiltered(s))return false;
    return true;
  });
  if(focusId){
    targetSites=targetSites.filter(s=>s.id===focusId);
  }else{
    if(search){
      targetSites=targetSites.filter(s=>{
        const hay=((s.name||'')+' '+(s.addr||'')).toLowerCase();
        return hay.includes(search);
      });
    }
    if(mode==='pending'){
      targetSites=targetSites.filter(s=>{
        return s.processes.some(p=>(p.children||[]).some(c=>c.ordered===false));
      });
    }
  }
  targetSites=_smpSortSites(targetSites);

  let totalPending=0;
  sites.forEach(s=>{
    if(s.archived)return;
    s.processes.forEach(p=>(p.children||[]).forEach(c=>{
      if(c.ordered===false)totalPending++;
      (c.extraMaterials||[]).forEach(ex=>{if(ex.ordered===false)totalPending++;});
    }));
  });

  let html=tabHead+`
    <div class="smp-toolbar" style="border-top:none">
      ${focusId?'':`
        <div style="font-size:11px;color:${totalPending>0?'#A32D2D':'#1D9E75'};margin-left:4px">未発注 ${totalPending}件</div>
        <input id="ordSearch" placeholder="🔍 物件名・所在地で絞り込み" value="${esc(_orderFilter.search)}" oninput="onOrderSearch(this.value)" style="flex:1;min-width:120px">
        <select onchange="_orderFilter.mode=this.value;renderOrderListMode()">
          <option value="pending" ${mode==='pending'?'selected':''}>未発注のみ</option>
          <option value="all" ${mode==='all'?'selected':''}>すべて</option>
        </select>
      `}

    </div>
    <div class="smp-body">`;

  if(!targetSites.length){
    html+=`<div class="smp-empty">${mode==='pending'?'未発注の物件はありません 🎉':'発注管理対象の子項目を持つ物件がありません'}</div>`;
  }else{
    targetSites.forEach(site=>{
      const mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(site.addr||'');
      // この物件で表示する子項目（mode=pendingなら未発注のみ、allなら全件）
      let visibleChildren=[];
      site.processes.forEach(proc=>{
        (proc.children||[]).forEach(c=>{
          if(c.ordered===undefined)return;
          if(mode==='pending'&&c.ordered===true)return;
          visibleChildren.push({proc,child:c});
        });
      });
      if(!visibleChildren.length)return;

      html+=`<div class="smp-block">
        <div class="smp-site-head">
          <div class="row1">
            ${_ordKoukiBadge(site)}
            <span class="smp-site-name">${esc(site.name)}</span>
            ${site.dropboxUrl?`<a href="${site.dropboxUrl}" target="_blank" style="flex-shrink:0;text-decoration:none;display:flex;align-items:center;color:#FFC84A;margin-left:4px" title="Dropbox 見積①"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></a>`:''}${site.dropboxUrl2?`<a href="${site.dropboxUrl2}" target="_blank" style="flex-shrink:0;text-decoration:none;display:flex;align-items:center;color:#FFA0A0;margin-left:2px" title="Dropbox 見積②"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></a>`:''}
          </div>
          <div class="smp-site-meta">
            📍 ${esc(site.addr||'住所未登録')} ${site.addr?`<a href="${mapUrl}" target="_blank">[地図]</a>`:''}<br>
            🔑 ${site.keyLocation?esc(site.keyLocation):'<span style="color:#aaa">鍵所在未登録</span>'}
          </div>
        </div>`;

      // 工程ごとにまとめる（同じ工程が連続する場合は工程ヘッダ1回だけ）
      let lastProcId=null;
      visibleChildren.forEach(({proc,child})=>{
        if(proc.id!==lastProcId){
          // 発注件数カウント
          const _procChildren=(proc.children||[]).filter(c=>c.ordered!==undefined);
          const _procDone=_procChildren.filter(c=>c.ordered===true).length;
          const _procTotal=_procChildren.length;
          let _procBadgeCls='smp-proc-badge-pending';
          let _procBadgeTxt=`未発注${_procTotal-_procDone}件`;
          if(_procDone===_procTotal){_procBadgeCls='smp-proc-badge-done';_procBadgeTxt='✓ 全発注済';}
          else if(_procDone>0){_procBadgeCls='smp-proc-badge-partial';_procBadgeTxt=`${_procDone}/${_procTotal} 発注済`;}
          // 担当者
          const _assignee=getAssignee(proc.name,site.id,proc.id);
          const _assigneeColor=ASSIGNEE_COLORS[_assignee]||'#888';
          const _assigneeName=ASSIGNEE_NAMES[_assignee]||_assignee;
          const _isDefault=_assignee===(ASSIGNEE_DEFAULTS[proc.name]||ASSIGNEE_DEFAULT_OTHER);
          const _procColor=proc.color||'#7cb9ff';
          html+=`<div class="smp-proc-head">
            <div class="smp-proc-head-inner">
              <div class="smp-proc-head-accent" style="background:${_procColor}"></div>
              <div class="smp-proc-head-body" style="background:${_procColor}22">
                <span class="smp-proc-head-name" style="color:${_procColor.toLowerCase()==='#ffffff'||_procColor.toLowerCase()==='#fff'?'#333':'#1D3A5C'}">${esc(proc.name||'(工程名なし)')}</span>
                <span class="smp-proc-badge ${_procBadgeCls}">${_procBadgeTxt}</span>
              </div>
              <div class="smp-proc-head-right">
                <span class="assignee-dot" style="background:${_assigneeColor}"></span>
                <select class="assignee-select" onchange="setAssignee(${site.id},${proc.id},this.value)">
                  <option value="okawa" ${_assignee==='okawa'?'selected':''}>大川</option>
                  <option value="nishiya" ${_assignee==='nishiya'?'selected':''}>西谷</option>
                  <option value="self" ${_assignee==='self'?'selected':''}>小沼</option>
                </select>
                ${!_isDefault?'<span class="assignee-changed">変更済</span>':''}
              </div>
            </div>
          </div>`;
          // サマリーボックス：品番入力済み・未発注の子項目をまとめて表示
          // クロス計算ボックスが出る子項目は除外（二重表示を防ぐ）
          const _hasCalcBox=(c)=>{
            const p=_splitMaterial(c.material||'');
            if(!p.num)return false;
            const norm=p.num.trim().toUpperCase();
            if(!/^[A-Z0-9]/.test(norm))return false;
            if(/^CF/.test(norm))return true; // CF品番はcalc-result-boxが出る
            if(/クロス/.test(proc.name||'')||/クロス/.test(c.name||''))return true;
            return false;
          };
          const _summaryChildren=(proc.children||[]).filter(c=>{
            if(c.ordered===true)return false;
            if(!_hasMaterial(c.material))return false;
            return !_hasCalcBox(c);
          });
          if(_summaryChildren.length>0){
            html+=_summaryChildren.map(c=>{
              const p=_splitMaterial(c.material||'');
              const numTxt=p.num?`<span>${esc(p.num)}</span>`:'';
              const sizeTxt=p.size?`<span>${esc(p.size)}</span>`:'';
              const qtyTxt=(p.qty&&parseInt(p.qty)>1)?`<span>× ${esc(p.qty)}</span>`:'';
              // extraMaterialsも追記
              const extraHtml=(c.extraMaterials||[]).filter(ex=>ex.ordered!==true&&_hasMaterial(ex.material)).map(ex=>{
                const ep=_splitMaterial(ex.material||'');
                const en=ep.num?`<span>${esc(ep.num)}</span>`:'';
                const es=ep.size?`<span>${esc(ep.size)}</span>`:'';
                const eq=(ep.qty&&parseInt(ep.qty)>1)?`<span>× ${esc(ep.qty)}</span>`:'';
                return `<div class="ord-summary-box" style="margin-top:2px">
                  <div class="osb-child-name">${esc(c.name||'')} (追加品番)</div>
                  <div class="osb-main">${en}${es}${eq}</div>
                </div>`;
              }).join('');
              return `<div class="ord-summary-box">
                <div class="osb-child-name">${esc(c.name||'')}</div>
                <div class="osb-main">${numTxt}${sizeTxt}${qtyTxt}</div>
              </div>${extraHtml}`;
            }).join('');
          }
          lastProcId=proc.id;
          // 工程内の全visibleChildをまとめて青ボックスを生成
          const _procVisibleIds=visibleChildren.filter(x=>x.proc.id===proc.id).map(x=>x.child.id);
          html+=_renderProcCalcBoxes(site.id, proc.id, proc.name, _procVisibleIds);
        }
        const isOrdered=(child.ordered===true);
        const hasMaterial=_hasMaterial(child.material);
        const parts=_splitMaterial(child.material||'');
        // ＋×ボタン用：同名兄弟の数を計算
        const _ordBaseName=(child.name||'').replace(/[①-⑨]+\s*$/,'').trim();
        const _ordSiblings=(proc.children||[]).filter(x=>{
          const n=(x.name||'').replace(/[①-⑨]+\s*$/,'').trim();
          return n===_ordBaseName&&x.ordered!==undefined;
        });
        const _ordCanDelete=_ordSiblings.length>1;
        // クラス：発注済み / 品番未入力で発注不可 / 通常未発注
        let rowCls='smp-child';
        if(isOrdered)rowCls+=' ord-done';
        else if(child.skipReason)rowCls+=' ord-skipped';
        else if(!hasMaterial)rowCls+=' ord-disabled';
        else rowCls+=' ord-pending';
        // 在庫・発注チェックは_renderProcCalcBoxesで処理
        // 工程内の最後のchildのときだけ編集ボタンを表示
        const _isLastInProc = (() => {
          const allInProc = visibleChildren.filter(x => x.proc.id === proc.id);
          return allInProc[allInProc.length - 1].child.id === child.id;
        })();
        html+=`<div class="${rowCls}" id="ordchild_${child.id}"></div>`;
        if(_isLastInProc) {
          html+=`<button class="ord-edit-btn" onclick="ordOpenEditModal(${site.id},${proc.id})">
            📐 寸法・品番を編集
          </button>`;
        }
      });

      html+='</div>';
    });
  }

  html+=`</div><!-- /smp-body -->
    <button id="smpSaveBtn" class="smp-save-fab" onclick="smpManualSave()">💾 保存</button>
  </div><!-- /smp-panel --></div><!-- /smp-overlay -->
  <div id="smpSaving" class="smp-saving">✓ 保存しました</div>`;

  v.innerHTML=html;
  // textarea初期高さを内容に合わせて調整
  v.querySelectorAll('.f-qty').forEach(ta=>{if(ta.tagName==='TEXTAREA'){ta.style.height='';const h=Math.max(32,ta.scrollHeight);ta.style.height=h+'px';}});
  _initSwipeDelete(v);
}

// 在庫タブの中身
async function _loadAndRenderStockLog(){
  const el=document.getElementById('stockLogBody');
  if(!el)return;
  try{
    const r=await fetch(GAS_URL+'?action=load_stock_log');
    const j=await r.json();
    if(!j.ok||!j.logs||j.logs.length===0){
      el.innerHTML='<div style="color:#aaa;font-size:12px;padding:20px 0;text-align:center">使用履歴がありません</div>';
      return;
    }
    // 検索フィルタ
    const sq=(_stockFilter.search||'').trim().toLowerCase();
    const logs=sq?j.logs.filter(l=>(l.code||'').toLowerCase().includes(sq)):j.logs;
    let html=`<input placeholder="品番で絞り込み" value="${esc(sq)}" oninput="_filterStockLog(this.value)" style="width:100%;box-sizing:border-box;border:0.5px solid #ccc;border-radius:4px;padding:6px 8px;font-size:12px;margin-bottom:8px">`;
    logs.forEach(l=>{
      const d=l.used_at?new Date(l.used_at):null;
      const dateStr=d?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:'';
      const spec=[l.code,l.qty,l.count>1?l.count+'本':null].filter(Boolean).join(' ');
      html+=`<div style="border:0.5px solid #e0e0e0;border-radius:6px;padding:9px 12px;background:#fff;margin-bottom:5px">
        <div style="font-size:13px;font-weight:500;color:#333;margin-bottom:3px">${esc(l.site_name||'（物件不明）')}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;font-weight:500;color:#1565c0;font-family:monospace">${esc(l.code||'')}</span>
          <span style="font-size:12px;color:#666">${esc(l.qty||'')}${l.count>1?' × '+l.count+'本':''}</span>
          <span style="font-size:11px;color:#aaa;margin-left:auto">${dateStr}</span>
        </div>
      </div>`;
    });
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div style="color:#e00;font-size:12px;padding:20px 0;text-align:center">読み込みエラー</div>';
  }
}

}

function _renderStockTabBody(){
  const focusId=_orderFilter.focusSiteId;
  const focusSite=focusId?sites.find(s=>s.id===focusId):null;
  // 在庫を新しい順にソート
  const sorted=[...stocks].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  // 物件フォーカス時はその物件の在庫のみ、それ以外は検索フィルタ
  let filtered;
  if(focusId){
    filtered=sorted.filter(s=>s.siteId===focusId);
  }else{
    const sq=(_stockFilter.search||'').trim().toLowerCase().replace(/[\s　]+/g,'');
    if(sq){
      const {direct,alias}=_stockMatchWithAlias(sq);
      const aliasIds=new Set([...direct,...alias].map(s=>s.id));
      filtered=sorted.filter(s=>{
        const code=(s.code||'').toLowerCase().replace(/[\s　]+/g,'');
        return code.includes(sq)||aliasIds.has(s.id);
      });
    }else{
      filtered=sorted;
    }
  }

  const toolbarRight=focusId
    ?`<button class="btn btn-sm" onclick="_stockFilter.search='';_orderFilter.focusSiteId=null;renderOrderListMode()" style="font-size:10px;margin-left:auto">全在庫を見る</button>`
    :`<input id="stockSearch" placeholder="🔍 品番で絞り込み" value="${esc(_stockFilter.search||'')}" oninput="onStockSearch(this.value)" style="flex:1;min-width:100px">`;

  let html=`<div class="smp-toolbar" style="border-top:none">
    <button class="btn btn-sm smp-back-btn" onclick="openStockAddModal(${focusId||'null'})" style="background:#1D9E75;color:#fff;border-color:#1a8763;font-weight:500">+ 在庫追加</button>
    <div style="font-size:11px;color:#666;margin-left:4px">${focusId?`この物件 ${filtered.length}件`:`合計 ${stocks.length}件`}</div>
    ${toolbarRight}
  </div>
  <div class="smp-body">`;

  if(!filtered.length){
    html+=`<div class="smp-empty">${focusId?'この物件の在庫はありません。':(stocks.length===0?'在庫はありません。<br><br><button class="btn" onclick="ordSwitchTab(&#39;list&#39;)" style="margin-top:8px;background:#185FA5;color:#fff;border-color:#185FA5">→ 発注一覧へ</button>':'該当する在庫がありません。')}</div>`;
  }else{
    filtered.forEach(s=>{
      const siteName=s.siteId?(()=>{
        const st=sites.find(x=>x.id===s.siteId);
        return st?st.name:'(物件不明)';
      })():'';
      html+=`<div class="stock-item-wrap" id="stock_${s.id}">
        <div class="stock-item" style="padding-right:10px">
          <div class="stock-row1">
            <span class="stock-code">${esc(s.code||'(品番なし)')}</span>
            <span class="stock-qty">${esc(s.qty||'')}</span>
            ${s.count>1?`<span style="font-size:12px;color:var(--color-text-secondary)">× ${s.count}本</span>`:''}
            <div style="margin-left:auto;display:flex;gap:4px;align-items:center">
              <button class="btn btn-sm stock-action-btn" data-code="${esc(s.code||'')}" data-siteid="${s.siteId||''}" onclick="openStockAddModal(parseInt(this.dataset.siteid)||null,this.dataset.code)" style="font-size:10px;padding:0 5px;height:20px;background:#e6f1fb;color:#185FA5;border-color:#85B7EB" title="同じ品番で追加">＋</button>
              <button class="btn btn-sm stock-action-btn" onclick="openStockEditModal(${s.id})" style="font-size:10px;padding:0 5px;height:20px" title="編集">編集</button>
              <button class="btn btn-sm stock-action-btn" onclick="deleteStock(${s.id})" style="font-size:10px;padding:0 5px;height:20px;color:#c00;border-color:#ecc">削除</button>
            </div>
          </div>
          <div class="stock-row2">
            ${!focusId&&siteName?`<span class="stock-from">📍 ${esc(siteName)}</span>`:''}
            ${s.addedBy?`<span class="stock-by">👤 ${esc(s.addedBy)}</span>`:''}
            ${s.date?`<span class="stock-date">📅 ${esc(s.date)}</span>`:''}
          </div>
          ${s.note?`<div class="stock-note">${esc(s.note)}</div>`:''}
        </div>
      </div>`;
    });
  }
  html+='</div>';
  return html;
}

    <div style="background:#fff;border-radius:12px;max-width:440px;width:100%;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,0.3);animation:smp-modal-in 0.18s ease-out">

      <div id="stockChildList" style="display:none;margin-bottom:10px;background:#f7faff;border:1px solid #d6e6f5;border-radius:6px;padding:8px;max-height:280px;overflow-y:auto"></div>
      <div id="stockManualSection" style="margin-bottom:10px">

        <input id="stockAddNote" placeholder="メモ（任意）" style="width:100%;height:28px;font-size:12px;padding:0 8px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;margin-top:4px">
      </div>
      <div style="display:flex;gap:6px;justify-content:flex-end">

        <button onclick="saveStockAdd()" style="height:34px;padding:0 18px;font-size:13px;background:#1D9E75;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:500">保存</button>
      </div>
    </div>`;

  // 手入力欄の初期行を追加
  _addStockManualRow(preSelectCode||'');

  if(preSelectSiteId) setTimeout(()=>{
    _onStockSiteChange();

    if(preSelectCode){
      setTimeout(()=>{
        const inputs=document.querySelectorAll('.stock-bulk-qty');
        for(const inp of inputs){
          if((inp.getAttribute('data-code')||'').toLowerCase()===preSelectCode.toLowerCase()){
            inp.scrollIntoView({behavior:'smooth',block:'center'});

            break;
          }
        }
      },80);
    }
  },30);
}

// 物件選択時：その物件の品番付き子項目をリスト表示
function _onStockSiteChange(){
  const sel=document.getElementById('stockAddSite');
  const list=document.getElementById('stockChildList');
  const manual=document.getElementById('stockManualSection');
  const sid=parseInt(sel.value,10);
  if(!sid){list.style.display='none';list.innerHTML='';manual.style.display='';return;}
  const s=sites.find(x=>x.id===sid);
  if(!s){list.style.display='none';return;}
  // 品番が入っている子項目を集める
  const items=[];
  s.processes.forEach(p=>{
    (p.children||[]).forEach(c=>{
      if(_hasMaterial(c.material)){
        const parts=_splitMaterial(c.material);
        items.push({procName:p.name,childName:c.name,code:parts.num,fullMaterial:_materialStr(c.material)});
      }
    });
  });
  if(!items.length){
    list.innerHTML='<div style="font-size:12px;color:#888;text-align:center;padding:8px">この物件には品番入力済みの項目がありません。下の「手入力」から登録してください。</div>';
    list.style.display='';
    manual.style.display='';
    return;
  }
  // この物件の既存在庫を品番ごとに整理
  const existingStocks={};
  stocks.filter(st=>st.siteId===sid).forEach(st=>{
    const code=(st.code||'').toLowerCase();
    if(!existingStocks[code])existingStocks[code]=[];
    existingStocks[code].push(st);
  });

  let html='<div style="font-size:11px;color:#555;margin-bottom:6px;font-weight:500">余りが出た品番に数量を入力：</div>';
  items.forEach((it,i)=>{
    const groupId='sbg_'+i;
    const codeKey=it.code.toLowerCase();

function saveStockAdd(){
  const sel=document.getElementById('stockAddSite');
  const sid=parseInt(sel.value,10)||null;
  const note=document.getElementById('stockAddNote').value.trim();
  const today=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  const user=getCurrentUser();
  let added=0;

  // 物件選択時の品番一覧から数量入力されたものを保存
  // data-stock-idがある場合は既存レコードを更新、ない場合は新規追加
  document.querySelectorAll('.stock-bulk-qty').forEach(inp=>{
    const qty=inp.value.trim();
    const code=inp.getAttribute('data-code');
    const stockId=inp.getAttribute('data-stock-id');
    const cntEl=inp.closest('div')&&inp.closest('div').querySelector('.stock-bulk-count');
    const bulkCount=cntEl?parseInt(cntEl.value)||1:1;
    if(stockId){
      const existing=stocks.find(x=>x.id===parseInt(stockId));
      if(existing){
        existing.qty=qty;existing.count=bulkCount>1?bulkCount:undefined;existing.note=note;added++;
      }
    }else{
      if(bulkCount<1&&!qty)return;
      stocks.push({id:nextStockId++,code,qty,count:bulkCount>1?bulkCount:undefined,siteId:sid,addedBy:user,date:today,note});
      added++;
    }
  });

  // 手入力欄（複数行）
  document.querySelectorAll('.stock-manual-row').forEach(row=>{
    const code=row.querySelector('.sma-code').value.trim();
    const qty=row.querySelector('.sma-spec').value.trim();
    const countVal=parseInt(row.querySelector('.sma-count').value)||undefined;
    if(code){
      stocks.push({id:nextStockId++,code,qty,count:countVal&&countVal>1?countVal:undefined,siteId:sid,addedBy:user,date:today,note});
      added++;
    }
  });

  if(added===0){
    alert('数量が入力されていません。少なくとも1件は数量を入力してください。');
    return;
  }
  saveStocks();
  closeStockAddModal();
  smpToast(`✓ ${added}件 在庫に追加しました`);
  renderOrderListMode();
}

function ordConfirmSkip(type, childId, exId){
  const containerId = (type==='ex') ? 'extra_'+exId : 'ordchild_'+childId;
  const ta=document.getElementById('skip_ta_'+containerId);
  const reason=(ta?ta.value:'').trim();
  if(!reason){if(ta){ta.style.borderColor='#f00';ta.focus();}return;}
  let found=false;
  if(type==='ex'){
    sites.forEach(s=>s.processes.forEach(p=>(p.children||[]).forEach(c=>{
      (c.extraMaterials||[]).forEach(ex=>{
        if(c.id===childId&&ex.id===exId){ex.skipReason=reason;found=true;}
      });

    sites.forEach(s=>s.processes.forEach(p=>(p.children||[]).forEach(c=>{
      if(c.id===childId){c.skipReason=reason;found=true;}
    })));
  }
  if(found){saveData();renderOrderListMode();}
}

        <span style="font-size:11px;color:#aaa">m / 計${totalM}m</span>
        <button onclick="ordUseStockConfirm(${stockId},'${type||'ch'}',${childId},${exId||0},true)" style="background:#f9a825;border:none;border-radius:4px;color:#fff;font-size:12px;font-weight:500;padding:5px 12px;cursor:pointer">使う</button>
        <button onclick="this.closest('.stock-use-picker').remove()" style="background:none;border:1px solid #ccc;border-radius:4px;font-size:11px;padding:5px 8px;cursor:pointer;color:#666">キャンセル</button>

        <button onclick="this.closest('.stock-use-picker').remove()" style="background:none;border:1px solid #ccc;border-radius:4px;font-size:11px;padding:5px 8px;cursor:pointer;color:#666">キャンセル</button>
      </div>`;

function ordUseStockConfirm(stockId, type, childId, exId, isMeter){
  const s=stocks.find(x=>x.id===stockId);if(!s)return;
  const inp=document.getElementById('suq_picker_'+stockId);
  const useVal=parseFloat(inp?inp.value:1)||1;
  const useCount=isMeter?useVal:Math.min(Math.round(useVal),s.count||1);
  let targetObj=null;
  sites.forEach(si=>si.processes.forEach(p=>(p.children||[]).forEach(c=>{
    if(type==='ex'){
      (c.extraMaterials||[]).forEach(ex=>{if(c.id===childId&&ex.id===exId){targetObj=ex;}});
    } else {
      if(c.id===childId)targetObj=c;
    }
  })));
  if(targetObj){targetObj.usedStockId=stockId;targetObj.usedStockCount=useCount;}
  const focusSiteId=_orderFilter.focusSiteId;
  const focusSite=focusSiteId?sites.find(x=>x.id===focusSiteId):null;
  const logEntry={id:Date.now(),site_name:focusSite?focusSite.name:'',code:s.code||'',qty:s.qty||'',count:useCount,used_at:new Date().toISOString()};
  fetch(GAS_URL,{method:'POST',body:new URLSearchParams({action:'save_stock_log',log:JSON.stringify(logEntry)})}).catch(()=>{});
  if(isMeter){
    // m単位：合計mから引いて残量を本数に分割
    const perM=parseFloat(((s.qty||'').trim().match(/^(\d+(?:\.\d+)?)\s*[mｍ]/i)||[])[1]||0);
    const totalM=Math.round(perM*(s.count||1)*10)/10;
    const remainM=Math.round((totalM-useCount)*10)/10;
    if(remainM<=0){
      stocks=stocks.filter(x=>x.id!==stockId);
      smpToast('✓ 在庫を使いました（在庫なし）');
    } else if(perM>0){
      const fullRolls=Math.floor(remainM/perM);
      const rem=Math.round((remainM-fullRolls*perM)*10)/10;
      if(fullRolls>0&&rem>0){
        s.count=fullRolls;
        stocks.push({id:nextStockId++,code:s.code,qty:rem+'m',count:1,siteId:s.siteId,addedBy:s.addedBy,date:s.date,note:s.note});
      } else if(fullRolls>0){
        s.count=fullRolls;
      } else {
        s.qty=remainM+'m';s.count=1;
      }
      smpToast(`✓ 在庫を使いました（残り${remainM}m）`);
    } else {
      s.qty=remainM+'m';s.count=1;
      smpToast(`✓ 在庫を使いました（残り${remainM}m）`);
    }
  } else {
    if((s.count||1)>useCount){
      s.count=(s.count||1)-useCount;
      smpToast(`✓ 在庫を使いました（残り${s.count}本）`);
    } else {
      stocks=stocks.filter(x=>x.id!==stockId);
      smpToast('✓ 在庫を使いました（在庫なし）');
    }
  }
  saveStocks();saveData();renderOrderListMode();
}

    if(mainParts.num) allMaterials.push({type:'main',num:mainParts.num,size:mainParts.size,qty:mainParts.qty,child,ex:null});
    (child.extraMaterials||[]).forEach(ex=>{
      if(ex.sizeOnly){
        // サイズ追加は親品番グループに含める（別途処理）
      } else {
        const ep=_splitMaterial(ex.material||'');
        if(ep.num) allMaterials.push({type:'extra',num:ep.num,size:ep.size,qty:ep.qty,child,ex});
      }
    });
    allMaterials.forEach(mat=>{
      const cls=colorIdx%2===0?'c0':'c1';
      colorIdx++;
      const repeatKey='repeat_'+siteId+'_'+procId+'_'+child.id+'_'+mat.num.toUpperCase();
      const repeatCm=parseInt(localStorage.getItem(repeatKey))||0;
      const isCross=/クロス/.test(proc.name||'')||/クロス/.test(child.name||'');
      const hasQty=!!mat.qty;
      const warnHtml=!hasQty?`<span class="ord-edit-cg-warn">⚠ 数量を入力してください</span>`:'';

      // サイズ追加行
      let sizeRows='';
      if(mat.type==='main'){
        (child.extraMaterials||[]).filter(ex=>ex.sizeOnly).forEach(ex=>{
          const ep=_splitMaterial(ex.material||'');
          sizeRows+=`<div class="ord-edit-fgd">
            <input value="${esc(ep.size)}" placeholder="サイズ" oninput="smpMarkDirty(this)" onchange="smpUpdateExtraMaterial(${siteId},${procId},${child.id},${ex.id})">
            <input value="${esc(ep.qty)}" placeholder="数量" ${!ep.qty?'class="ord-edit-input-warn"':''} oninput="smpMarkDirty(this)" onchange="smpUpdateExtraMaterial(${siteId},${procId},${child.id},${ex.id})">
            <button class="ord-edit-db" onclick="smpDelSibling(${siteId},${procId},${child.id},${ex.id},'order');ordOpenEditModal(${siteId},${procId})">×</button>
          </div>`;
        });
      }

      const repeatHtml=isCross&&mat.type==='main'?`<div class="ord-edit-repeat">
        <label>リピート</label>
        <input type="number" value="${repeatCm||''}" placeholder="なし" min="0" maxlength="3"
          onchange="setCalcRepeat(${siteId},${procId},${child.id},'${mat.num.toUpperCase().replace(/'/g,"\\'")}',this.value);renderOrderListMode()">
        <span>cm（0=なし）</span>
      </div>`:'';

      const onchangeFn=mat.type==='extra'
        ?`smpUpdateExtraMaterial(${siteId},${procId},${child.id},${mat.ex.id})`
        :`ordUpdateMaterial(${siteId},${procId},${child.id})`;
      const addSizeFn=mat.type==='main'
        ?`smpAddSibling(${siteId},${procId},${child.id},'size');ordOpenEditModal(${siteId},${procId})`
        :'';

      groupsHtml+=`<div class="ord-edit-code-group ${cls}">
        <div class="ord-edit-cg-title">${esc(mat.num)} ${warnHtml}</div>
        <div class="ord-edit-fl"><div>サイズ</div><div>数量</div><div></div></div>
        <div class="ord-edit-fgd">
          <input value="${esc(mat.size)}" placeholder="サイズ" oninput="smpMarkDirty(this)" onchange="${onchangeFn}">
          <input value="${esc(mat.qty)}" placeholder="数量" ${!hasQty?'class="ord-edit-input-warn"':''} oninput="smpMarkDirty(this)" onchange="${onchangeFn}">
          <div></div>
        </div>
        ${sizeRows}
        ${addSizeFn?`<button class="ord-edit-sab" onclick="${addSizeFn}">＋ サイズ追加</button>`:''}
        ${repeatHtml}
      </div>`;
    });
  });

  const existing=document.getElementById('ordEditModalOverlay');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='ordEditModalOverlay';
  overlay.className='ord-edit-modal-overlay';
  overlay.innerHTML=`<div class="ord-edit-modal">
    <div class="ord-edit-modal-head">
      <div class="ord-edit-modal-title">📐 ${esc(proc.name)} — 寸法・品番を編集</div>
      <button class="ord-edit-modal-close" onclick="document.getElementById('ordEditModalOverlay').remove()">✕</button>
    </div>
    ${groupsHtml}
    <button class="ord-edit-acb" onclick="smpAddSibling(${siteId},${procId},${children[0]&&children[0].id||0},'sibling');ordOpenEditModal(${siteId},${procId})">＋ 品番追加</button>
    <button class="ord-edit-save" onclick="smpManualSave();document.getElementById('ordEditModalOverlay').remove();renderOrderListMode()">💾 保存して閉じる</button>
  </div>`;
  document.body.appendChild(overlay);
}

// 発注一覧モードの品番・数量更新（保存処理は寸法入力モードと同じ）
function ordUpdateMaterial(siteId,procId,childId){
  const s=sites.find(x=>x.id===siteId);if(!s)return;
  const p=s.processes.find(x=>x.id===procId);if(!p)return;
  const c=(p.children||[]).find(x=>x.id===childId);if(!c)return;
  const row=document.getElementById('ordchild_'+childId);if(!row)return;
  const num=(row.querySelector('.f-num')||{value:''}).value.trim();
  const size=(row.querySelector('.f-size')||{value:''}).value.trim();
  const qty=(row.querySelector('.f-qty')||{value:''}).value.trim();
  row.querySelectorAll('.f-num,.f-size,.f-qty').forEach(el=>el.classList.remove('dirty'));
  const newMat=_joinMaterial(num,size,qty);
  if(JSON.stringify(c.material)===JSON.stringify(newMat))return;
  c.material=newMat;
  const _u=getCurrentUser();
  if(_u)c.materialBy=_u;
  const _d=new Date();
  c.materialAt=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
  saveData(siteId);
  smpToast('✓ 保存しました');
  renderOrderListMode();
  setTimeout(()=>render(),10);
}

// 発注済みチェックの切替
function ordToggleExtraOrdered(siteId,procId,childId,extraId,checked){
  const s=sites.find(x=>x.id===siteId);if(!s)return;
  const p=s.processes.find(x=>x.id===procId);if(!p)return;
  const c=(p.children||[]).find(x=>x.id===childId);if(!c)return;
  const ex=(c.extraMaterials||[]).find(x=>x.id===extraId);if(!ex)return;
  if(checked&&!_hasMaterial(ex.material)){
    alert('品番が未入力のため発注済みにできません。先に品番を入力してください。');
    renderOrderListMode();
    return;
  }
  // チェックを外したとき在庫を戻す
  if(!checked&&ex.usedStockId){
    const st=stocks.find(x=>x.id===ex.usedStockId);
    const returnCount=ex.usedStockCount||1;
    if(st){st.count=(st.count||1)+returnCount;}
    else{
      const parts=_splitMaterial(ex.material||'');
      stocks.push({id:ex.usedStockId,code:parts.num||'',qty:parts.size||'',count:returnCount});
    }
    delete ex.usedStockId;
    delete ex.usedStockCount;
    saveStocks();
    smpToast('✓ 在庫を戻しました');
  }
  ex.ordered=checked?true:false;
  if(checked)smpToast('✓ 発注済みにしました');
  saveData(siteId);
  renderOrderListMode();
  setTimeout(()=>render(),10);
}

let _masterDrag={key:null,fromIdx:null};
function masterDragStart(e,key,idx){_masterDrag={key,fromIdx:idx};e.dataTransfer.effectAllowed='move';}
function masterDrop(e,key,toIdx){
  if(_masterDrag.key!==key||_masterDrag.fromIdx===null)return;
  const arr=masters[key];
  const[moved]=arr.splice(_masterDrag.fromIdx,1);
  arr.splice(toIdx,0,moved);
  saveMasters();openMasterModal();
}
function editMaster(key,idx,val){val=val.trim();if(!val)return;masters[key][idx]=val;saveMasters();}
function addMaster(key,inputId){
  const v=document.getElementById(inputId).value.trim();if(!v)return;
  if(!masters[key].includes(v))masters[key].push(v);
  saveMasters();openMasterModal();
}
function delMaster(key,idx){masters[key].splice(idx,1);saveMasters();openMasterModal();}

function exportCSV(){
  const rows=[['物件名','所在地','元受','工程名','担当者','面積','開始日','終了日','完了']];
  sites.forEach(s=>s.processes.forEach(p=>(p.periods||[]).forEach(pd=>rows.push([s.name,s.addr,s.client,p.name,p.person,p.area,pd.startD,pd.endD,p.done?'完了':'']))));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.map(r=>r.join(',')).join('\n'));
  a.download='工程表_'+fmt(new Date())+'.csv';a.click();
}

function exportJSON(){
  const backup={
    exportedAt:new Date().toISOString(),
    version:1,
    siteCount:sites.length,
    sites:sites,
    masters:masters
  };
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='工程表バックアップ_'+fmt(new Date())+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

function importJSON(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json,application/json';
  input.onchange=(e)=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.sites||!Array.isArray(data.sites)){alert('このファイルは工程表バックアップではありません');return;}
        const msg='バックアップを読み込みます。\n\n'
          +'エクスポート日時: '+(data.exportedAt||'不明')+'\n'
          +'物件数: '+data.siteCount+'件\n\n'
          +'【重要】現在の全データが上書きされます。\n'
          +'本当に復元しますか？';
        if(!confirm(msg))return;
        if(!confirm('最終確認：現在のデータは完全に消えます。よろしいですか？'))return;
        sites=normalizeSites(data.sites);
        if(data.masters)masters=data.masters;
        saveData();saveMasters();render();
        alert('復元が完了しました。'+sites.length+'件の物件を読み込みました。');
      }catch(err){
        alert('ファイルの読み込みに失敗しました: '+err.message);
      }
    };
    reader.readAsText(f);
  };
  input.click();
}

function showDonePopup(sid,pid,cx,cy){
  const site=sites.find(s=>s.id===sid);
  const proc=site&&site.processes.find(p=>p.id===pid);
  if(!proc)return;
  const old=document.getElementById('donePopup');if(old)old.remove();
  const pop=document.createElement('div');
  pop.id='donePopup';
  pop.style.cssText='position:fixed;z-index:2000;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);padding:8px 0;min-width:180px;left:'+Math.min(cx,window.innerWidth-200)+'px;top:'+Math.min(cy,window.innerHeight-120)+'px';
  const nm=document.createElement('div');nm.style.cssText='padding:8px 16px 6px;font-size:12px;font-weight:600;color:#0C447C;border-bottom:1px solid #eee';nm.textContent=proc.name;pop.appendChild(nm);
  // 子項目一覧
  const ch=proc.children||[];
  if(ch.length>0){
    const cl2=document.createElement('div');cl2.style.cssText='padding:6px 16px;border-bottom:1px solid #eee';
    cl2.innerHTML=ch.map(c=>'<div style="font-size:11px;color:#555;padding:2px 0">└ '+esc(c.name)+(c.area?' <span style="color:#aaa">'+esc(c.area)+'</span>':'')+'</div>').join('');
    pop.appendChild(cl2);
  }
  if(!proc.done){const d=document.createElement('div');d.style.cssText='padding:12px 16px;font-size:14px;cursor:pointer;color:#1D9E75';d.textContent='✓ 完了にする';d.onclick=()=>{pop.remove();toggleDone(pid);};pop.appendChild(d);}
  if(proc.done){const d=document.createElement('div');d.style.cssText='padding:12px 16px;font-size:14px;cursor:pointer;color:#E74C3C';d.textContent='↩ 未完了に戻す';d.onclick=()=>toggleDone(pid);pop.appendChild(d);}
  const cl=document.createElement('div');cl.style.cssText='padding:10px 16px;font-size:13px;cursor:pointer;color:#aaa;border-top:1px solid #eee';cl.textContent='キャンセル';cl.onclick=()=>pop.remove();pop.appendChild(cl);
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('touchstart',()=>{const p=document.getElementById('donePopup');if(p)p.remove();},{once:true}),100);
}

    if(_dirLocked)return;
    const dx=Math.abs(e.touches[0].clientX-_tsX);
    const dy=Math.abs(e.touches[0].clientY-_tsY);
    if(dx<5&&dy<5)return;
    _dirLocked=true;
    if(dx>dy){
      // 横スクロール確定
      _gs.style.touchAction='pan-x';
    }else{
      // 縦スクロール確定
      _gs.style.touchAction='pan-y';
    }
  },{passive:true});
  _gs.addEventListener('touchend',function(){
    _dirLocked=false;
    _gs.style.touchAction='pan-x pan-y';
  },{passive:true});
}

// スマホ：下に引っ張ってリロード
if(_isSP){
  let _ptr_startY=0,_ptr_el=null;
  const _PTR_THRESHOLD=150;
  const _ganttScroll=document.getElementById('ganttScroll');
  document.addEventListener('touchstart',function(e){
    if(document.getElementById('modalEl').innerHTML)return;
    if(_ganttScroll.scrollTop>0)return;
    if(window.scrollY>0)return;
    _ptr_startY=e.touches[0].clientY;
    _ptr_el=document.createElement('div');
    _ptr_el.id='ptrIndicator';
    _ptr_el.style.cssText='position:fixed;top:0;left:0;right:0;height:0;background:#e6f1fb;display:flex;align-items:flex-end;justify-content:center;z-index:200;overflow:hidden;transition:none;font-size:12px;color:#185FA5;padding-bottom:4px;';
    _ptr_el.textContent='↓ 引っ張ってリロード';
    document.body.appendChild(_ptr_el);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!_ptr_el)return;
    const dy=e.touches[0].clientY-_ptr_startY;
    if(dy>0&&_ganttScroll.scrollTop===0){
      _ptr_el.style.height=Math.min(dy*0.5,60)+'px';
      _ptr_el.textContent=dy>_PTR_THRESHOLD?'↑ 離してリロード':'↓ もっと引っ張って';
    }
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!_ptr_el)return;
    const dy=e.changedTouches[0].clientY-_ptr_startY;
    if(dy>_PTR_THRESHOLD&&_ganttScroll.scrollTop===0){
      _ptr_el.style.height='40px';
      _ptr_el.textContent='🔄 リロード中…';
      setTimeout(()=>location.reload(),300);
    }else{
      _ptr_el.remove();
      _ptr_el=null;
    }
  },{passive:true});
}
</script>
